# Параметри захвата й огляду для pick_node. Це ваш файл: build_robot його НЕ перезаписує.
# Перевірте на офіційному xArm Gripper (дивіться кроки калібрування в інструкції).
pick_node:
  ros__parameters:
    tcp_to_tip: 0.0      # м: кінчики пальців попереду link_tcp (0, якщо link_tcp стоїть на кінчиках)
    jaw_axis: "y"        # вісь зведення пальців у кадрі link_tcp: "y" або "x"
    finger_len: 0.07     # м: довжина пальців (для перевірки колізії зі столом)
    palm_len: 0.10       # м: довжина корпусу захвата позаду пальців
    look_height: 0.28    # м: висота TCP над центром книги в позі огляду
    lift: 0.15           # м: підйом книги
