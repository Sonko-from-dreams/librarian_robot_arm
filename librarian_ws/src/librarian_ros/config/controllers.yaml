controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    xarm7_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
xarm7_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_nonzero_velocity_at_trajectory_end: true
gripper_controller:
  ros__parameters:
    joints:
    - drive_joint
    - left_finger_joint
    - left_inner_knuckle_joint
    - right_outer_knuckle_joint
    - right_finger_joint
    - right_inner_knuckle_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_nonzero_velocity_at_trajectory_end: true
